<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My QUEEN, can you be my Valentine's?</title>
    <style>
        :root {
            --primary-red: #d00000;
            --soft-pink: #ff4d6d;
            --bg-color: #ffe4e1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            margin: 0;
            transition: background 0.5s;
        }

        /* Dedication Text */
        .dedication {
            position: absolute;
            top: env(safe-area-inset-top, 40px);
            width: 90%;
            text-align: center;
            color: var(--primary-red);
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 20;
        }

        .secret-lover {
            display: block;
            font-size: 1rem;
            color: var(--soft-pink);
            font-style: italic;
            margin-top: 5px;
        }

        /* Falling Hearts */
        .heart {
            position: fixed;
            top: -20px;
            color: var(--soft-pink);
            font-size: 24px;
            user-select: none;
            z-index: -1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Main Card */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.98);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            z-index: 10;
            width: 85%;
            max-width: 350px;
        }

        h1, h2 { color: var(--primary-red); font-size: 1.6rem; margin-bottom: 10px; }
        
        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            transition: 0.2s;
            margin-top: 10px;
        }

        #yesBtn, #moreBtn, #videoBtn { background-color: var(--soft-pink); color: white; }
        #videoBtn { background: linear-gradient(45deg, #ff4d6d, #d00000); }
        #noBtn { background-color: #a0a0a0; color: white; position: relative; }
        
        .celebration, .secret-gift-panel { display: none; }
        .emoji-box { font-size: 3rem; display: block; margin: 15px 0; animation: bounce 1.2s infinite; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* VIDEO MODAL */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #videoOverlay video { width: 90%; max-width: 500px; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 77, 109, 0.6); }
    </style>
</head>
<body>

    <div class="dedication">
        For Shaina Ly
