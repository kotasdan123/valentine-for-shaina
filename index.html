<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My QUEEN, can you be my Valentine's?</title>
    <style>
        :root {
            --primary-red: #d00000;
            --soft-pink: #ff4d6d;
            --bg-color: #ffe4e1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            margin: 0;
            transition: background 0.5s;
        }

        /* Standard Elements */
        .dedication { position: absolute; top: env(safe-area-inset-top, 40px); width: 90%; text-align: center; color: var(--primary-red); font-weight: bold; z-index: 20; }
        .secret-lover { display: block; font-size: 1rem; color: var(--soft-pink); font-style: italic; }
        .heart { position: fixed; top: -20px; color: var(--soft-pink); font-size: 24px; z-index: -1; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* Container & Panels */
        .container { text-align: center; background: rgba(255, 255, 255, 0.98); padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2); z-index: 10; width: 85%; max-width: 350px; }
        .celebration, .secret-gift-panel { display: none; }
        h1, h2 { color: var(--primary-red); margin-bottom: 10px; }

        /* Buttons */
        button { padding: 16px 32px; font-size: 1.1rem; cursor: pointer; border: none; border-radius: 50px; font-weight: bold; -webkit-tap-highlight-color: transparent; transition: 0.2s; margin-top: 10px; }
        #yesBtn, #moreBtn, #videoBtn { background-color: var(--soft-pink); color: white; }
        #videoBtn { background: linear-gradient(45deg, #ff4d6d, #d00000); box-shadow: 0 4px 15px rgba(208, 0, 0, 0.3); }
        #noBtn { background-color: #a0a0a0; color: white; position: relative; }

        /* Video Modal (The Pop-up) */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #videoOverlay video { width: 90%; max-width: 500px; border-radius: 15px; box-shadow: 0 0 20px rgba(255, 77, 109, 0.5); }
        .close-video { color: white; margin-top: 20px; font-size: 1rem; text-decoration: underline; cursor: pointer; }

        .emoji-box { font-size: 3rem; display: block; margin: 15px 0; animation: bounce 1.2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    </style>
</head>
<body>

    <div class="dedication">
        For Shaina Lyca Sam 🌸
        <span class="secret-lover">From your secret lover.. GAB 💌</span>
    </div>

    <div id="videoOverlay">
        <video id="giftVideo" controls playsinline>
            <source src="https://www.dropbox.com/scl/fi/68kclit0wlgghjhb2z4kh/Surprise.mp4?rlkey=1mzfn1vjshg1rfcsie1luvtp0&st=vpzv6xmp&dl=0" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="close-video" onclick="closeVideo()">Close Surprise ❌</div>
    </div>

    <div class="container" id="card">
        <div id="content">
            <h1>My QUEEN, can you be my Valentine's? 👑</h1>
            <div id="beggingText" style="height:40px; color:var(--soft-pink); font-weight:bold;">I promise to treat you like royalty! ✨</div>
            <div class="buttons" style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                <button id="yesBtn">Yes! 😍</button>
                <button id="noBtn">No 🥺</button>
            </div>
        </div>

        <div id="message" class="celebration">
            I knew you'd say Yes! <br>See you on February 16! 🥰
            <span class="emoji-box">❤️💍👑</span>
            <button id="moreBtn">You want more? click here</button>
        </div>

        <div id="secretGift" class="secret-gift-panel">
            <h2>Secret Gift 🎁</h2>
            <p>This is a secret gift for your eyes only.</p>
            <button id="videoBtn">Watch Your Surprise 🎥</button>
            <span class="emoji-box">💖😘✨🌹💎</span>
        </div>
    </div>

    <script>
        // Setup variables
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const moreBtn = document.getElementById('moreBtn');
        const videoBtn = document.getElementById('videoBtn');
        const overlay = document.getElementById('videoOverlay');
        const giftVideo = document.getElementById('giftVideo');

        // Page navigation logic
        yesBtn.addEventListener('click', () => {
            document.getElementById('content').style.display = 'none';
            document.getElementById('message').style.display = 'block';
            document.body.style.backgroundColor = '#ff4d6d';
            explodeHearts();
        });

        moreBtn.addEventListener('click', () => {
            document.getElementById('message').style.display = 'none';
            document.getElementById('secretGift').style.display = 'block';
            document.body.style.backgroundColor = '#d00000';
            explodeHearts();
        });

        // Video Pop-up logic
        videoBtn.addEventListener('click', () => {
            overlay.style.display = 'flex';
            giftVideo.play(); // Auto-plays when opened
            explodeHearts();
        });

        function closeVideo() {
            overlay.style.display = 'none';
            giftVideo.pause(); // Stops video when closed
        }

        // Heart animation
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 400);

        function explodeHearts() {
            for(let i=0; i<50; i++) setTimeout(createHeart, i * 15);
        }

        // No button dodging (iPhone touch fix)
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.random() * 80 + '%';
            noBtn.style.top = Math.random() * 80 + '%';
        });
    </script>
</body>
</html>
