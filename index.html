<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My QUEEN, can you be my Valentine's?</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe4e1;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            margin: 0;
            transition: background 0.5s;
        }

        #trailCanvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .dedication {
            position: absolute;
            top: 20px;
            width: 90%;
            text-align: center;
            color: #d00000;
            font-weight: bold;
            font-size: 1.3rem;
            z-index: 20;
        }

        .heart {
            position: fixed;
            top: -20px;
            color: #ff4d6d;
            font-size: 20px;
            pointer-events: none;
            z-index: -1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.3);
            z-index: 10;
            width: 85%;
            max-width: 400px;
        }

        h1 { color: #d00000; font-size: 1.8rem; margin-bottom: 10px; }
        #beggingText { height: 40px; color: #ff4d6d; font-style: italic; font-weight: bold; margin-bottom: 15px; display: block;}
        
        .buttons { 
            margin-top: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px;
            min-height: 180px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }

        #noBtn { 
            background-color: #888; 
            color: white; 
            position: relative;
            z-index: 100;
            transition: all 0.2s ease;
        }

        #yesBtn { background-color: #ff4d6d; color: white; }

        .score-display {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #d00000;
            font-weight: bold;
        }

        #musicControl {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: #fff;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid #ff4d6d;
        }
        
        .celebration, .secret-gift-panel { display: none; font-size: 1.5rem; color: #ff4d6d; font-weight: bold; }
        .emoji-box { font-size: 3.5rem; display: block; margin-top: 15px; animation: bounce 1s infinite; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <canvas id="trailCanvas"></canvas>
    <div id="musicControl">🎵 Play Music</div>
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <div class="dedication">
        For YOU 🌸
        <span class="secret-lover" style="display:block; font-size:1.1rem; color:#ff4d6d; font-style:italic;">From your Secret Lover.. 💌</span>
    </div>

    <div class="container" id="card">
        <div id="content">
            <h1>My QUEEN, can you be my Valentine's? 👑</h1>
            <span id="beggingText">I promise to treat you like royalty! ✨</span>
            <div class="buttons">
                <button id="noBtn">No 🥺</button>
                <button id="yesBtn">Yes! 😍</button>
            </div>
            <div class="score-display">Heartbreak Score: <span id="scoreVal">0</span></div>
        </div>

        <div id="message" class="celebration">
            I knew you'd say Yes! <br>See you on February 16! 🥰
            <span class="emoji-box">❤️💍👑</span>
            <button id="moreBtn" style="margin-top:20px; background:#ff4d6d; color:white;">You want more? click here</button>
        </div>

        <div id="secretGift" class="secret-gift-panel">
            <h2>Secret Gift 🎁</h2>
            <p id="finalScore"></p>
            <span class="emoji-box">💖😘✨🌹💎</span>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const moreBtn = document.getElementById('moreBtn');
        const content = document.getElementById('content');
        const message = document.getElementById('message');
        const secretGift = document.getElementById('secretGift');
        const beggingText = document.getElementById('beggingText');
        const scoreDisplay = document.getElementById('scoreVal');
        const musicControl = document.getElementById('musicControl');
        const bgMusic = document.getElementById('bgMusic');
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let yesSize = 1;
        let particles = [];

        // Setup Canvas
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function createFirework(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 8,
                    dy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    life: 1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(animate);
        }
        animate();

        function moveNo() {
            // "Avoid" logic: only move if score is high or random chance
            const shouldAvoid = score > 10 || Math.random() > 0.5;
            if (!shouldAvoid) return;

            // Speed logic: faster after 50 clicks
            const speed = score >= 50 ? "0.1s" : "0.3s";
            noBtn.style.transition = `all ${speed} ease`;

            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        noBtn.onmouseover = moveNo;

        noBtn.onclick = () => {
            score++;
            scoreDisplay.innerText = score;
            
            // Explosion every 10 clicks
            if (score % 10 === 0) {
                const rect = noBtn.getBoundingClientRect();
                createFirework(rect.left + rect.width/2, rect.top + rect.height/2);
            }

            // Move after click too
            moveNo();

            // Grow the Yes button
            yesSize += 0.15;
            yesBtn.style.transform = `scale(${yesSize})`;
            beggingText.innerText = "Wait, you actually clicked it?! 💔";
        };

        yesBtn.onclick = () => {
            content.style.display = 'none';
            message.style.display = 'block';
            document.body.style.backgroundColor = '#ffb6c1';
            noBtn.style.display = 'none';
        };

        moreBtn.onclick = () => {
            message.style.display = 'none';
            secretGift.style.display = 'block';
            document.getElementById('finalScore').innerHTML = `Final Heartbreak Score: ${score} <br> I still love you though! ❤️`;
        };

        musicControl.onclick = () => {
            if (bgMusic.paused) { bgMusic.play(); musicControl.innerText = "⏸ Pause"; }
            else { bgMusic.pause(); musicControl.innerText = "🎵 Play"; }
        };

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
